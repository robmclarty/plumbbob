name: Publish

# Publishes plumbbob to npm with provenance when a vX.Y.Z tag is pushed. Auth is
# npm Trusted Publishing (OIDC): no token exists anywhere - the registry trusts
# this exact workflow's identity, minted per run, so there is no secret to leak
# or rotate and no 2FA bypass. Provenance links the published tarball to this
# commit and workflow run, verifiable on npmjs.com and via `npm audit
# signatures`.
#
# One-time setup outside the repo (both are required for the first run):
#   - npmjs.com: package plumbbob -> Settings -> Trusted Publisher ->
#     GitHub Actions, repository robmclarty/plumbbob, workflow filename
#     publish.yaml, environment npm-publish.
#   - GitHub: repo Settings -> Environments -> npm-publish, with a required
#     reviewer (yourself). The run pauses there until a maintainer approves -
#     the CI equivalent of the local MFA prompt this replaces.
#
# release.yaml (the GitHub Release for the same tag) stays a separate workflow
# so its `contents: write` never shares a job with `id-token: write`.

on:
  push:
    tags: ['v[0-9]*']
  # Manual re-run hatch: a tag is immutable, so a publish that failed for a
  # reason outside the tree (auth, registry) can be retried from the Actions tab
  # - the tarball contents are identical, and npm refuses an already-published
  # version. The version guard below re-checks that HEAD still matches the tag.
  workflow_dispatch:

permissions:
  contents: read # checkout only
  id-token: write # OIDC identity for npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish # required-reviewer gate: the human approval step
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Fail fast when the tag and package.json disagree - a mistagged push
      # would otherwise publish a version whose tag points at the wrong code.
      # On workflow_dispatch (the manual re-run hatch) there is no pushed tag:
      # instead require that v<version> exists on origin and points at HEAD, so
      # a retry can only republish exactly what the tag froze.
      - name: Verify tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$GITHUB_REF_NAME" != "$version" ]; then
              echo "::error::pushed tag $GITHUB_REF_NAME does not match package.json version $version"
              exit 1
            fi
          else
            if ! git fetch --force --depth=1 origin "refs/tags/$version:refs/tags/$version"; then
              echo "::error::tag $version not found on origin"
              exit 1
            fi
            if [ "$(git rev-parse "$version^{}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::tag $version does not point at HEAD"
              exit 1
            fi
          fi

      # plumbbob pins pnpm in devEngines.packageManager (not the top-level
      # packageManager field action-setup auto-reads), so state the version.
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.2

      # No registry-url here: setup-node would write an .npmrc keyed to a
      # NODE_AUTH_TOKEN env var, which shadows the tokenless OIDC flow.
      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      # Trusted Publishing needs npm >= 11.5.1; pin the major to be sure.
      - name: Update npm
        run: npm install -g npm@11

      # Frozen install reproduces the hoisted layout (pnpm-workspace.yaml sets
      # nodeLinker: hoisted) so node_modules/checkride is a real directory - a
      # bundleDependency needs that to pack into the tarball.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The full gate (checkride: types, lint, struct, dead, tests, docs, links).
      # A release must be green.
      - name: Check
        run: pnpm check

      - name: Build
        run: pnpm build

      # npm (not pnpm) publish: the OIDC token exchange is an npm CLI flow.
      # prepack (clean + build) reruns the build as a safety net inside publish.
      # --provenance is redundant under trusted publishing but documents intent
      # and fails closed if the OIDC identity is ever absent.
      #
      # devEngines.packageManager pins pnpm, and npm 11 validates that on every
      # npm command (EBADDEVENGINES) — including this publish, since the runner's
      # manager is npm, not pnpm, and it can't download-and-reexec pnpm to run an
      # npm publish. Strip the field from the ephemeral checkout just before
      # publishing: it's a dev-only pin the published tarball never needs, and the
      # repo's strict pnpm guard stays intact for contributors. node (not
      # `npm pkg`) does the edit so it can't trip the same guard.
      - name: Publish with provenance
        run: |
          node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));delete p.devEngines;fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
          npm publish --provenance --access public
