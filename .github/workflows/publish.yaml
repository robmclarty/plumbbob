name: Publish

# Publishes plumbbob to npm with provenance when a vX.Y.Z tag is pushed. Auth is
# npm Trusted Publishing (OIDC): no token exists anywhere - the registry trusts
# this exact workflow's identity, minted per run, so there is no secret to leak
# or rotate and no 2FA bypass. Provenance links the published tarball to this
# commit and workflow run, verifiable on npmjs.com and via `npm audit
# signatures`.
#
# Two jobs, so the OIDC identity never shares a job with the repo's
# dependencies. `build` installs them, runs the gate and packs the tarball,
# with no way to mint a token. `publish` holds id-token: write and the
# approval gate, and runs nothing from the repo: it downloads that tarball and
# publishes it as it is, with scripts off. A compromised dev dependency can
# still fail the build, but it can't publish with this workflow's identity.
#
# One-time setup outside the repo (both are required for the first run):
#   - npmjs.com: package plumbbob -> Settings -> Trusted Publisher ->
#     GitHub Actions, repository robmclarty/plumbbob, workflow filename
#     publish.yaml, environment npm-publish.
#   - GitHub: repo Settings -> Environments -> npm-publish, with a required
#     reviewer (yourself). The run pauses there until a maintainer approves -
#     the CI equivalent of the local MFA prompt this replaces.
#
# release.yaml (the GitHub Release for the same tag) stays a separate workflow
# so its `contents: write` never shares a job with `id-token: write`.

on:
  push:
    tags: ['v[0-9]*']
  # Manual re-run hatch: a tag is immutable, so a publish that failed for a
  # reason outside the tree (auth, registry) can be retried from the Actions tab
  # - the tarball contents are identical, and npm refuses an already-published
  # version. The version guard below re-checks that HEAD still matches the tag.
  workflow_dispatch:

permissions:
  contents: read # checkout only; the publish job swaps this for id-token alone

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Fail fast when the tag and package.json disagree - a mistagged push
      # would otherwise publish a version whose tag points at the wrong code.
      # On workflow_dispatch (the manual re-run hatch) there is no pushed tag:
      # instead require that v<version> exists on origin and points at HEAD, so
      # a retry can only republish exactly what the tag froze.
      - name: Verify tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$GITHUB_REF_NAME" != "$version" ]; then
              echo "::error::pushed tag $GITHUB_REF_NAME does not match package.json version $version"
              exit 1
            fi
          else
            if ! git fetch --force --depth=1 origin "refs/tags/$version:refs/tags/$version"; then
              echo "::error::tag $version not found on origin"
              exit 1
            fi
            if [ "$(git rev-parse "$version^{}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::tag $version does not point at HEAD"
              exit 1
            fi
          fi

      # plumbbob pins pnpm in devEngines.packageManager (not the top-level
      # packageManager field action-setup auto-reads), so state the version.
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.2

      # No pnpm cache here: a cache can be written by other runs, and what this
      # job packs is what gets published.
      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      # Frozen install reproduces the hoisted layout (pnpm-workspace.yaml sets
      # nodeLinker: hoisted) so node_modules/checkride is a real directory - a
      # bundleDependency needs that to pack into the tarball.
      #
      # Copy, never hard-link, out of the store. pnpm on Linux hard-links by
      # default, so two byte-identical files inside one package share an inode
      # (checkride 0.20.0 ships two copies of a rust main.rs template). npm pack
      # writes the second as a tar hard-link entry, and the registry rejects
      # the whole tarball with E415 "Hard link is not allowed", which sank
      # v0.14.1 after its approval. A copy gives each file its own inode.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --package-import-method=copy

      # The full gate (checkride: types, lint, struct, dead, tests, docs, links).
      # A release must be green.
      - name: Check
        run: pnpm check

      - name: Build
        run: pnpm build

      # npm pack runs prepack (clean + build), so the tarball holds a fresh
      # build, with node_modules/checkride bundled in.
      #
      # devEngines.packageManager pins pnpm, and npm 11 validates that on every
      # npm command (EBADDEVENGINES) — including this pack, since the runner's
      # manager is npm, not pnpm, and it can't download-and-reexec pnpm to run an
      # npm pack. Strip the field from the ephemeral checkout just before
      # packing: it's a dev-only pin the published tarball never needs, and the
      # repo's strict pnpm guard stays intact for contributors. node (not
      # `npm pkg`) does the edit so it can't trip the same guard.
      #
      # The last check refuses a tarball holding a hard-link entry. The
      # registry only says so at publish, after the approval gate; here the
      # build fails first and names the file.
      - name: Pack
        id: pack
        run: |
          node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));delete p.devEngines;fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          tarball="$name-$version.tgz"
          npm pack
          test -f "$tarball"
          listing="$(tar -tvzf "$tarball")"
          if printf '%s\n' "$listing" | grep -E '^h'; then
            echo "::error::$tarball holds hard-link entries (listed above); the npm registry rejects them"
            exit 1
          fi
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: ${{ steps.pack.outputs.tarball }}
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm-publish # required-reviewer gate: the human approval step
    permissions:
      id-token: write # OIDC identity for npm trusted publishing + provenance
    steps:
      # No registry-url here: setup-node would write an .npmrc keyed to a
      # NODE_AUTH_TOKEN env var, which shadows the tokenless OIDC flow.
      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      # Trusted Publishing needs npm >= 11.5.1; pin the major to be sure.
      - name: Update npm
        run: npm install -g npm@11 --ignore-scripts

      - name: Download tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      # npm (not pnpm) publish: the OIDC token exchange is an npm CLI flow.
      # There's no checkout here, so no devEngines to trip on, and
      # --ignore-scripts keeps prepack from running again. --provenance is
      # redundant under trusted publishing but documents intent and fails
      # closed if the OIDC identity is ever absent.
      - name: Publish with provenance
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: npm publish "./$TARBALL" --provenance --access public --ignore-scripts
