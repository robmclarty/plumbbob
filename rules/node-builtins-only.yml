id: node-builtins-only
language: typescript
severity: error
message: 'C2: import node: builtins, relative paths, or an allowlisted dependency (checkride) only — new dependencies are a deliberate decision, not a casual install. (Test files may import devDeps like vitest; they are excluded.)'
files:
  - 'src/**/*.ts'
ignores:
  - 'src/**/__tests__/**'
rule:
  pattern: import $$$IMPORTS from '$SRC'
constraints:
  SRC:
    not:
      regex: '^(node:|\.|/|checkride$)'
