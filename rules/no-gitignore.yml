id: no-gitignore
language: typescript
severity: error
message: "D33 (info-exclude): excludes are personal machinery — write them to the shared gitdir's info/exclude (gitPath(root, 'info/exclude')), never to .gitignore, so nothing is imposed on the repo."
files:
  - 'src/**/*.ts'
ignores:
  - 'src/**/__tests__/**'
rule:
  kind: string_fragment
  regex: '\.gitignore'
