# Vale — the `prose` slot. Written by `checkride init --add prose`; yours now.
#
# The styles under .vale/styles/Repo are plain YAML in this repo: no download,
# no `vale sync` on the default path, nothing to keep in step with an upstream.
# Disagree with a rule and the answer is to edit or delete it, not to suppress
# it line by line — a style full of suppressions is ceremony.

StylesPath = .vale/styles

# Report everything; only errors decide the check. Vale exits non-zero for
# error-severity alerts alone, so demoting a rule to `warning` keeps it visible
# here while making it advisory — which is why this stays at `suggestion`.
# Raise it and you stop seeing the advisory half rather than silencing it.
MinAlertLevel = suggestion

# Vale has no TypeScript format of its own. Mapping it to JavaScript lints doc
# comments and string-free prose, and leaves the code alone.
[formats]
ts = js

[*.{md,ts}]
BasedOnStyles = Vale, Repo

# One spell checker, one wordlist. The `spell` slot (cspell) owns spelling and
# knows the technical vocabulary a plain en_US dictionary flags as errors.
Vale.Spelling = NO

# A vocabulary file is that second wordlist through another door — same reason.
Vale.Terms = NO

# The subjective half. Every other rule here is mechanical; this one is taste,
# and taste belongs to whoever writes the docs. Read
# .vale/styles/Repo/Weasel.yml and flip this to YES if you agree with it.
Repo.Weasel = NO

# The exemplars are the reference these rules were derived from, so they are the
# one place that has to name what it forbids: docs/voice/voice.md lists "the
# ask," "the lift," seamless, and game-changing in order to ban them, and every
# one comes back as a hit. A finding here also has no legal fix, because the
# exemplars are hand-written and the model never edits them; that is the whole
# point of the folder (docs/generation-loss.md). checkride agrees from the other
# side and never scores prose against the exemplars, since judging voice is a
# human call. Read the folder, do not lint it.
[docs/voice/*]
BasedOnStyles =
