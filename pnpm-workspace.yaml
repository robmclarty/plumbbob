# pnpm 11 gates dependency build scripts behind an explicit allowlist. ast-grep's
# postinstall swaps its JS launcher for the raw native binary, which breaks under
# pnpm's `node`-invoking bin shim (it tries to parse the Mach-O as JS). Deny the
# build: the JS launcher resolves the platform binary at runtime and works
# cross-platform — the only cost is a one-line per-invocation stderr notice.
allowBuilds:
  '@ast-grep/cli': false
  # vale ships as a Go binary its postinstall fetches per platform; without the
  # build there is no `vale` to exec and the `prose` slot cannot run. Allowed
  # deliberately: it is the one dependency here that reaches the network at
  # install time, and the version is exact-pinned so the fetch is reproducible.
  '@vvago/vale': true

# `bundleDependencies` (checkride ships inside the npm tarball so the extracted
# tarball runs with no install step — the Claude Code plugin cache is a bare
# tarball extract) needs a real directory at node_modules/checkride to pack;
# pnpm's default symlinked layout can't be bundled, so hoist.
nodeLinker: hoisted

# pnpm 11's `minimumReleaseAge` (48h) refuses freshly-published versions as a
# supply-chain cooldown. checkride and fascicle are our own packages (checkride =
# the check gate dep; fascicle = the eval-tier driver, devDependency only) —
# exempt them so we can pull a just-published release without waiting out the age.
minimumReleaseAgeExclude:
  - checkride
  - fascicle
